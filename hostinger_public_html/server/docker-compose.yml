version: '3.8'

services:
  mysqldb:
    image: mysql:8.0
    container_name: andaman_mysql
    restart: always
    environment:
      MYSQL_DATABASE: andaman_trails
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: .
    container_name: andaman_backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: mysqldb
      DB_PORT: 3306
      DB_NAME: andaman_trails
      DB_USER: root
      DB_PASSWORD: rootpassword
      JWT_SECRET: super_secret_andaman_trails_jwt_token_key_2026
    depends_on:
      - mysqldb

volumes:
  mysql_data:
